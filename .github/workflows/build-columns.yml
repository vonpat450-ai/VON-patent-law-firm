name: Build columns

on:
  push:
    branches: [main]
    paths:
      - "dist/articles/**"
      - "scripts/build_column.py"
      - "scripts/prerender_pages.mjs"
      - "scripts/optimize_seo.py"
      - "dist/app.js"
      - ".github/workflows/build-columns.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-columns
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build article pages and listing
        run: python3 scripts/build_column.py
      - name: Refresh sitemap
        run: python3 scripts/generate_sitemap.py
      - name: Commit generated pages if changed
        run: |
          if git diff --quiet -- dist/ && [ -z "$(git ls-files --others --exclude-standard dist/)" ]; then
            echo "Column pages and sitemap are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: build column pages"
          git push
