name: Publish verified daily patent column

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Seoul"
    - cron: "30 8 * * *"
      timezone: "Asia/Seoul"
    - cron: "0 9 * * *"
      timezone: "Asia/Seoul"
    - cron: "30 9 * * *"
      timezone: "Asia/Seoul"
    - cron: "0 10 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      check_existing:
        description: "Read-only check of today's published column"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-patent-column-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image renderer
        run: python3 -m pip install "Pillow>=10,<13"
      - name: Inspect today's live column without publishing
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/publish_daily_column.py verify-existing
      - name: Stage one queued column or retry its deployment
        if: ${{ github.event_name == 'schedule' }}
        env:
          COLUMN_SLOT: ${{ github.event.schedule }}
        run: python3 scripts/publish_daily_column.py stage --slot "$COLUMN_SLOT"
      - name: Push staged content to GitHub and Cloudflare Pages
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git add -A automation/queue/ automation/state.json dist/
          if git diff --cached --quiet; then
            echo "No new publication files for this slot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: stage daily patent column"
          git push
      - name: Check actual site visibility
        if: ${{ github.event_name == 'schedule' }}
        run: python3 scripts/publish_daily_column.py verify --wait-seconds 540
      - name: Save verified result or failure state
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git add -A automation/queue/ automation/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: record daily column verification"
          git push
      - name: Require public-site success
        if: ${{ github.event_name == 'schedule' }}
        run: python3 scripts/publish_daily_column.py assert-published
