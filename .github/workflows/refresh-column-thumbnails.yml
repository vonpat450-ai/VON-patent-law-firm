name: Refresh existing column thumbnails

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional comma-separated article slugs to refresh"
        type: string
        default: ""
      force_ai:
        description: "Generate fresh Magnific photos for selected slugs; fail if unavailable"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-patent-column-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install image renderer
        run: python3 -m pip install "Pillow>=10,<13"
      - name: Generate subject photos and compose thumbnails
        env:
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          THUMBNAIL_ONLY: ${{ inputs.only }}
          THUMBNAIL_FORCE_AI: ${{ inputs.force_ai }}
        run: python3 scripts/refresh_thumbnails.py
      - name: Rebuild article listing and pages
        run: |
          python3 scripts/build_column.py
          python3 scripts/generate_sitemap.py
      - name: Publish refreshed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          git commit -m "design: refresh patent column thumbnails"
          git pull --rebase origin main
          git push origin HEAD:main
