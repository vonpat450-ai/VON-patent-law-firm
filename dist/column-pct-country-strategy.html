          <article class="column-body"><p>“PCT 출원을 했으니 이제 해외 특허는 확보된 거죠?”</p>
<p>해외 사업을 준비하는 기업과 상담하다 보면 종종 듣게 되는 질문입니다.</p>
<p>국내 특허를 출원한 뒤 PCT 국제출원까지 진행하면 미국, 유럽, 중국, 일본 등 여러 국가에 한꺼번에 특허를 출원한 것처럼 느껴질 수 있습니다. 실제로 PCT 제도는 하나의 국제출원을 통해 여러 국가에서 특허를 받을 가능성을 확보해둘 수 있다는 점에서 매우 유용한 제도입니다.</p>
<p>하지만 여기에서 반드시 짚고 넘어가야 할 부분이 있습니다.</p>
<p class="column-emphasis"><strong>PCT 출원 자체가 곧 전 세계에서 특허권을 취득했다는 의미는 아니라는 점입니다.</strong></p>
<p>결국 일정한 기간 안에 실제 특허를 원하는 국가 또는 지역을 선택해 각국의 절차로 들어가야 합니다. 그리고 이때부터 기업은 현실적인 질문과 마주하게 됩니다.</p>
<p>“미국, 유럽, 중국, 일본을 모두 들어가야 할까?”</p>
<p>“매출이 아직 없는 국가에도 특허를 받아야 할까?”</p>
<p>“예산이 한정되어 있다면 어느 국가를 먼저 선택해야 할까?”</p>
<p>해외특허 전략에서는 바로 이 질문에 대한 답이 중요합니다.</p>
<h2 id="section-1">1. PCT는 ‘세계특허’가 아니라 선택할 시간을 확보하는 제도입니다</h2>
<p>해외특허를 확보하는 대표적인 방법은 크게 두 가지로 생각해볼 수 있습니다.</p>
<p>먼저 국내에 특허를 출원한 뒤 파리협약에 따른 우선권을 이용하여 일반적으로 최초 출원일로부터 12개월 이내에 미국, 중국, 일본 등 원하는 국가에 각각 직접 출원하는 방법이 있습니다.</p>
<p>또 다른 방법이 PCT 국제출원입니다.</p>
<p>PCT를 이용하면 국내 출원을 기초로 통상 12개월 이내에 국제출원을 진행하고, 이후 어느 국가에 실제로 특허를 가져갈 것인지 결정하는 시점을 뒤로 미룰 수 있습니다. WIPO는 국가단계 진입 시점을 일반적으로 우선일로부터 30개월이라고 안내하고 있으며, 국가에 따라 31개월 등 더 긴 기한이 적용되는 경우도 있습니다.</p>
<p>쉽게 말하면 PCT의 중요한 장점 중 하나는 <strong>해외특허를 포기하지 않으면서 시장을 판단할 시간을 확보할 수 있다는 것</strong>입니다.</p>
<p>국내 출원 직후에는 어떤 국가에서 제품이 잘 팔릴지, 어느 국가에 투자자가 나타날지, 해외 생산을 어디에서 진행할지 정확히 알기 어려운 경우가 많습니다.</p>
<p>PCT 제도를 활용하면 이러한 불확실성이 어느 정도 정리될 때까지 실제 국가별 출원에 필요한 비용을 뒤로 미루면서 전략을 검토할 수 있습니다.</p>
<h2 id="section-2">2. 그렇다면 30개월이 지나면 무엇을 결정해야 할까요?</h2>
<p>PCT 국제출원을 진행했다고 해서 이후 절차가 자동으로 이어지는 것은 아닙니다.</p>
<p>기업이 실제 특허권을 확보하고 싶은 국가를 정한 뒤 해당 국가 또는 지역의 <strong>국가단계·지역단계</strong>에 진입해야 합니다.</p>
<p>이 단계에서는 국가별 관납료가 발생할 수 있고, 현지 대리인이 필요한 경우도 있으며, 언어에 따라 번역 비용도 고려해야 합니다.</p>
<p>WIPO 역시 PCT 제도를 이용하더라도 최종적으로 특허를 부여하는 것은 각 국가 또는 지역 특허청이며, 국가단계에서는 현지 비용, 대리인 비용, 번역비용뿐 아니라 이후 특허 유지비와 분쟁 비용까지 고려할 필요가 있다고 설명하고 있습니다.</p>
<p>따라서 진입 국가가 늘어날수록 기업이 부담해야 하는 비용도 커질 수밖에 없습니다.</p>
<p>결국 중요한 것은</p>
<p class="column-emphasis"><strong>“가능한 모든 국가에 들어갈 것인가?”가 아니라 “우리 사업에서 어떤 국가의 특허가 실제로 필요한가?”를 판단하는 것입니다.</strong></p>
<h2 id="section-3">3. 첫 번째 기준은 ‘어디에서 팔 것인가’입니다</h2>
<p>가장 먼저 살펴볼 것은 시장입니다.</p>
<p>현재 제품이나 서비스를 판매하고 있는 국가뿐 아니라 향후 3~5년 안에 실제 진출 가능성이 높은 국가를 함께 살펴볼 필요가 있습니다.</p>
<p>예를 들어 국내 스타트업이 새로운 의료기기를 개발했고 미국 시장 진출을 핵심 성장 전략으로 세우고 있다면 미국 특허의 중요성은 자연스럽게 높아집니다.</p>
<p>반면 현재 사업계획에도 없고 유통 파트너도 없으며 향후 진출 가능성도 매우 낮은 국가까지 단순히 “큰 시장이니까”라는 이유만으로 특허를 진행하는 것이 항상 최선이라고 보기는 어렵습니다.</p>
<p>특허를 확보하는 목적은 결국 사업을 보호하기 위한 것입니다.</p>
<p>따라서 시장 규모뿐 아니라</p>
<ul class="column-list"><li>실제 판매 계획</li><li>현지 파트너 유무</li><li>인증·허가 가능성</li><li>유통망 확보 여부</li><li>향후 투자계획</li></ul>
<p>등을 함께 살펴보는 것이 좋습니다.</p>
<h2 id="section-4">4. 두 번째 기준은 ‘어디에서 만들 것인가’입니다</h2>
<p>판매 시장만큼 중요한 것이 생산기지입니다.</p>
<p>우리 제품을 한국에서 생산해 해외로 수출하는 사업도 있지만, 중국·베트남·인도 등 해외 제조업체에 생산을 맡기는 기업도 많습니다.</p>
<p>특히 OEM·ODM 또는 해외 위탁생산 구조에서는 생산이 이루어지는 국가 자체가 중요한 특허 전략 국가가 될 수 있습니다.</p>
<p>예를 들어 핵심 제품이 미국에서 주로 판매되더라도 실제 제조가 특정 국가에서 대규모로 이루어진다면 해당 국가에서의 특허 확보 필요성을 별도로 검토할 수 있습니다.</p>
<p>경쟁사가 동일하거나 유사한 제품을 그 국가에서 생산하는 상황까지 고려한다면, 판매국뿐 아니라 <strong>제조국에서 권리를 갖는 것의 사업적 가치</strong>도 커질 수 있습니다.</p>
<p>해외특허를 정할 때 단순히 “우리 고객이 어디에 있는가?”만 묻지 말고</p>
<p class="column-emphasis"><strong>“우리 제품과 경쟁사 제품은 어디에서 만들어지는가?”</strong></p>
<p>까지 함께 살펴봐야 하는 이유입니다.</p>
<h2 id="section-5">5. 세 번째 기준은 ‘경쟁사가 어디에 있는가’입니다</h2>
<p>해외특허는 우리 회사의 현재 사업만 보고 결정해서는 부족할 수 있습니다.</p>
<p>경쟁사의 움직임도 중요한 기준입니다.</p>
<p>경쟁기업이 어느 국가에 특허를 집중적으로 출원하고 있는지, 어느 시장에서 사업을 확장하고 있는지, 제조시설이나 연구개발 거점이 어디에 있는지 등을 함께 살펴볼 필요가 있습니다.</p>
<p>특히 특정 국가가 현재 우리 회사의 주요 시장은 아니더라도 경쟁사의 핵심 시장이라면 전략적 중요도가 높아질 수 있습니다.</p>
<p>반대로 시장 규모는 크지만 우리 기술을 실시하는 경쟁사가 거의 없고 사업 진입 가능성도 낮다면 우선순위를 조금 낮추는 선택도 가능합니다.</p>
<p>따라서 해외출원 국가를 결정하기 전에 주요 경쟁사의 특허 포트폴리오와 사업지역을 함께 분석하면 보다 현실적인 판단을 할 수 있습니다.</p>
<h2 id="section-6">6. 네 번째 기준은 ‘특허를 실제로 활용할 수 있는가’입니다</h2>
<p>특허는 등록증을 보유하는 것 자체가 목적이 아닙니다.</p>
<p>경쟁사의 진입을 막거나, 라이선스를 체결하거나, 투자·기술이전 과정에서 기업의 권리를 설명하거나, 실제 분쟁에서 활용할 수 있어야 의미가 있습니다.</p>
<p>따라서 국가를 선택할 때는 해당 국가에서 특허를 취득했을 때 실제 사업상 활용 가치가 있는지도 검토해야 합니다.</p>
<p>예를 들어 기술이전이나 현지 합작법인 설립 가능성이 높은 국가라면 특허가 중요한 협상 자산이 될 수 있습니다.</p>
<p>또 주요 글로벌 기업이 모여 있는 시장이라면 향후 라이선스 협상이나 M&amp;A 과정에서 해당 국가의 권리가 의미를 가질 수도 있습니다.</p>
<p>반대로 특허를 확보하더라도 실제 사업과 연결될 가능성이 거의 없다면 매년 발생하는 유지비용까지 고려했을 때 투자 대비 효율이 낮아질 수도 있습니다.</p>
<h2 id="section-7">7. 해외특허는 ‘출원 비용’만 보고 결정해서는 안 됩니다</h2>
<p>해외특허를 검토할 때 기업이 가장 먼저 보는 숫자는 대개 출원 비용입니다.</p>
<p>하지만 실제로는 등록 이후에도 비용이 계속 발생할 수 있습니다.</p>
<p>국가별 심사 대응 과정에서 현지 대리인 비용이 추가될 수 있고, 등록 후에는 권리를 유지하기 위한 연차료나 갱신 관련 비용도 고려해야 합니다.</p>
<p>분쟁이 발생한다면 소송이나 무효절차 등 훨씬 큰 비용이 발생할 가능성도 있습니다.</p>
<p>WIPO 역시 해외특허 국가를 선택할 때 초기 비용뿐 아니라 현지 대리, 번역, 유지비용과 잠재적인 소송 비용까지 함께 고려해야 한다고 안내하고 있습니다.</p>
<p>따라서 해외특허 전략은</p>
<p class="column-emphasis"><strong>“지금 얼마가 드는가?”</strong></p>
<p>보다</p>
<p class="column-emphasis"><strong>“이 권리를 앞으로 몇 년 동안 유지하면서 어느 정도의 사업가치를 얻을 수 있는가?”</strong></p>
<p>라는 질문으로 접근하는 것이 좋습니다.</p>
<h2 id="section-8">8. 예산이 부족하다면 모든 국가를 포기해야 할까요?</h2>
<p>그렇지는 않습니다.</p>
<p>오히려 예산이 제한적인 기업일수록 우선순위를 명확하게 정하는 것이 중요합니다.</p>
<p>예를 들어 후보 국가가 8개이지만 예산상 3~4개 국가만 선택할 수 있다면 다음과 같이 나누어볼 수 있습니다.</p>
<p><strong>1순위</strong> 현재 매출이 있거나 진출이 거의 확정된 핵심 시장</p>
<p><strong>2순위</strong> 경쟁사의 주요 시장 또는 핵심 제조국</p>
<p><strong>3순위</strong> 향후 투자·라이선스·기술이전 가능성이 높은 시장</p>
<p><strong>4순위</strong> 장기적으로 가능성은 있지만 현재 사업 연관성이 낮은 시장</p>
<p>이와 같은 기준을 바탕으로 국가별 중요도를 비교하면 단순히 시장 규모가 큰 국가를 일괄적으로 선택하는 것보다 기업의 상황에 맞는 전략을 세울 수 있습니다.</p>
<p>특히 PCT 국제출원 과정에서 확보한 국제조사보고서와 견해서 등을 참고하면, 각국에 큰 비용을 지출하기 전에 발명의 특허 가능성을 다시 검토하는 데 도움이 될 수 있습니다.</p>
<p>WIPO의 2026년 9월 PCT SME Support Series 역시 여러 후보 시장 중 제한된 예산으로 일부 국가만 국가단계에 진입해야 하는 스타트업을 예로 들면서, 시장과 비용, 사업전략을 함께 고려할 것을 강조하고 있습니다.</p>
<h2 id="section-9">9. PCT 출원 직후부터 국가 선택을 준비해야 합니다</h2>
<p>많은 기업이 국가단계 진입기한이 가까워진 뒤에야</p>
<p>“어느 나라로 들어갈까요?”</p>
<p>라고 고민하기 시작합니다.</p>
<p>하지만 해외특허 전략은 PCT 기한 직전에 급하게 정하기보다 국제출원 이후부터 사업계획과 함께 준비하는 것이 좋습니다.</p>
<p>예를 들어 다음과 같은 정보를 꾸준히 정리해둘 수 있습니다.</p>
<ul class="column-list"><li>국가별 예상 매출</li><li>해외 유통·판매 파트너</li><li>해외 제조국</li><li>주요 경쟁사의 진출 국가</li><li>국가별 경쟁사 특허</li><li>투자자 또는 기술수요기업의 소재지</li><li>국가별 출원·유지 예상비용</li></ul>
<p>이 정보를 PCT 국가단계 진입 전에 다시 비교하면 단순한 직감보다 훨씬 합리적인 결정을 내릴 수 있습니다.</p>
<p>또한 국가별 진입기한은 모두 동일하다고 단정해서는 안 됩니다.</p>
<p>WIPO가 제공하는 국가단계 기한표를 보면 일반적으로 우선일로부터 30개월을 기준으로 하지만, 국가나 지역에 따라 31개월 또는 그보다 다른 기한이 적용되는 경우가 있습니다. 따라서 실제 출원을 진행할 때는 해당 국가의 최신 기한을 개별적으로 확인해야 합니다.</p>
<h2 id="section-10">10. 마치며 — 해외특허의 핵심은 ‘많이’가 아니라 ‘어디에’입니다</h2>
<p>PCT 국제출원은 해외특허 전략의 중요한 출발점입니다.</p>
<p>하지만 PCT를 출원했다는 사실만으로 해외사업을 보호할 수 있는 것은 아닙니다.</p>
<p>결국 기업은 제한된 시간과 예산 안에서</p>
<p class="column-emphasis"><strong>어디에서 팔 것인지, 어디에서 만들 것인지, 경쟁사는 어디에 있는지, 그리고 그 특허를 실제로 어떻게 활용할 것인지</strong></p>
<p>를 기준으로 최종 국가를 선택해야 합니다.</p>
<p>해외특허는 국가 수가 많다고 반드시 좋은 전략이 되는 것은 아닙니다.</p>
<p>기업의 핵심 시장과 경쟁 구조를 정확하게 파악하고, 그에 맞는 국가에 권리를 집중하는 것이 오히려 더 강한 특허 포트폴리오를 만들 수 있습니다.</p>
<p>특히 해외시장 진출을 준비하는 중소기업이나 스타트업이라면 PCT 국가단계 진입기한이 임박해서 국가를 고르기보다, 국내 출원과 PCT 출원 단계부터 향후 사업지역과 특허비용을 함께 설계할 필요가 있습니다.</p>
<p>결국 해외특허 전략에서 가장 중요한 질문은</p>
<p class="column-emphasis"><strong>“몇 개 나라에 특허를 낼 것인가?”가 아니라 “우리 사업을 지키기 위해 어느 나라의 특허가 필요한가?”</strong></p>
<p>라고 할 수 있습니다.</p>
