          <p>PCT 국제조사보고서는 해외 각국에 진입하기 전 등록 가능성을 미리 가늠하고 특허청구범위를 수정하거나 진입 여부를 결정하는 핵심 판단 자료로 활용할 수 있습니다. 국제조사기관이 관련 선행기술을 조사하고 특허성에 대한 서면견해를 작성해 제공하므로, 불리한 결과가 나오더라도 출원인은 청구범위를 보정하여 발명을 명확히 구별하거나 국가단계 진입 전에 출원을 취하할 수 있습니다.</p>

          <article class="column-body"><p>PCT 국제조사보고서, 해외 출원 국가 결정 시 어떻게 활용해야 할까요?</p>
<p>PCT 국제출원을 마친 중소기업과 스타트업은 개별 국가단계 진입(보통 우선일로부터 30개월 시점)을 앞두고 진입 국가를 선정하는 과정에서 큰 고민에 빠집니다. 각 국가별로 번역료, 관납료, 현지 대리인 비용 등이 발생하므로, 등록 가능성이 불확실한 상태에서 여러 나라에 진입하는 것은 무리한 예산 지출로 이어질 수 있습니다.</p>
<p>이때 국제조사기관이 발송하는 PCT 국제조사보고서와 서면견해는 해외 진출 전략을 정비하고 비용 위험을 줄일 수 있는 객관적인 기준을 제공합니다.</p>
<section class="insight-part" id="section-1"><span class="insight-part-label">01 · 핵심 질문</span><h2>국제조사보고서의 핵심 역할 | 보고서에서 무엇을 확인할 수 있나요?</h2>
<p>국제조사보고서는 출원한 발명의 신규성과 진보성에 영향을 줄 수 있는 관련 선행기술 문헌을 확인해 제공합니다<a class="source-ref" href="#source-1" aria-label="참고 자료 1">〔1〕</a>. 국제조사기관(ISA)은 공표된 특허 문헌 및 기술 문헌 등 관련 선행기술을 조사하고, 발명의 특허 가능성에 관한 서면견해(written opinion)를 함께 작성합니다<a class="source-ref" href="#source-1" aria-label="참고 자료 1">〔1〕</a>. 이를 통해 기업은 개별 국가 특허청의 심사를 받기 전에 자사 기술의 특허 등록 가능성을 사전 평가할 수 있습니다<a class="source-ref" href="#source-1" aria-label="참고 자료 1">〔1〕</a>.</p>
</section>
<section class="insight-part" id="section-2"><span class="insight-part-label">02 · 핵심 질문</span><h2>조사 결과에 따른 대응 전략 | 불리한 보고서를 받으면 어떻게 해야 할까요?</h2>
<p>국제조사보고서 결과가 불리하게 나오더라도 국가단계 진입 전에 특허청구범위를 보정하거나 출원 전략을 변경할 수 있습니다<a class="source-ref" href="#source-1" aria-label="참고 자료 1">〔1〕</a>. 만약 조사보고서에 자사 발명의 신규성이나 진보성을 부정하는 선행기술 문헌이 인용된 경우, 출원인은 선행기술과 발명을 보다 분명하게 구별할 수 있도록 특허청구범위를 수정하여 공개하거나 필요시 출원을 취하할 수 있습니다<a class="source-ref" href="#source-1" aria-label="참고 자료 1">〔1〕</a>. 반대로 긍정적인 평가를 받았다면 진입 대상 국가에서 등록 가능성이 높다고 판단하고 국가단계 절차를 진행할 수 있습니다<a class="source-ref" href="#source-1" aria-label="참고 자료 1">〔1〕</a>.</p>
</section>
<section class="insight-part" id="section-3"><span class="insight-part-label">03 · 핵심 질문</span><h2>비용과 시간의 효율적 관리 | 국가단계 진입 판단은 언제 해야 할까요?</h2>
<p>PCT 절차를 이용하면 우선일로부터 보통 30개월이 될 때까지 개별 국가단계 진입을 유예할 수 있어 시장성과 특허성을 검토할 시간을 확보할 수 있습니다<a class="source-ref" href="#source-1" aria-label="참고 자료 1">〔1〕</a>. 국가단계 진입 시 소요되는 번역료, 관납료, 현지 대리인 비용은 전반적인 출원 절차에서 가장 큰 비중을 차지합니다<a class="source-ref" href="#source-1" aria-label="참고 자료 1">〔1〕</a>. 따라서 국제조사보고서와 서면견해를 통해 특허 가능성을 신중히 검증한 후, 사업적 가치가 높고 권리 확보 가능성이 있는 국가를 선택하여 진입하는 것이 예산을 절감하는 길입니다<a class="source-ref" href="#source-1" aria-label="참고 자료 1">〔1〕</a>.</p>
<div class="insight-checklist"><h4>내 상황 확인 항목</h4><ul><li>국제조사보고서에 인용된 선행기술 문헌이 자사 발명의 핵심 청구항을 지적하고 있는지 확인했는가?</li><li>조사기관의 서면견해를 바탕으로 특허청구범위 보정이 필요한지 검토했는가?</li><li>불리한 평가가 나온 경우 국가단계 진입 전에 청구범위 보정 또는 출원 취하 여부를 판단했는가?</li><li>우선일로부터 30개월 기한 내에 사업성이 입증된 국가를 우선순위로 선정했는가?</li></ul></div>
</section>
<section class="insight-part"><h2>마무리</h2>
<p>PCT 국제조사보고서는 단순한 절차 안내서가 아니라, 해외 각국 특허청에 비용을 투입하기 전 특허성을 미리 진단해 주는 리스크 관리 도구입니다. 국제조사기관의 서면견해를 바탕으로 청구범위를 적절히 보정하고, 사업적 실익이 있는 국가를 선별하여 해외 특허 전략을 수립하시기 바랍니다.</p>
